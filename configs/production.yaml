spark:
  app_name: SciGraphProduction
  master: local[4]
  shuffle_partitions: 64
  java_home: C:/Users/tousi/.jdks/openjdk-23.0.2
  hadoop_home: tools/hadoop
  extra_conf:
    spark.driver.memory: 6g
    spark.executor.memory: 6g
    spark.sql.adaptive.enabled: false
    spark.sql.maxPlanStringLength: 4096
    spark.sql.parquet.enableVectorizedReader: false
    spark.sql.parquet.columnarReaderBatchSize: 512
  benchmark_scale_records:
    - 10000
    - 50000
    - 100000
  text:
    min_token_length: 3
    top_n_terms: 100
    language: en
  clustering:
    k_values:
      - 8
      - 12
      - 20
    max_iter: 40
    seed: 660
    num_features: 16384
    min_token_length: 3
    language: en
    top_terms_per_cluster: 25
    representative_papers_per_cluster: 10
  graph:
    pagerank_iterations: 30
    pagerank_damping: 0.85
    top_n: 100
  streaming:
    batch_size: 5000
    alert_missing_title_rate: 0.0
    alert_missing_author_rate: 0.05
  retrieval:
    top_k: 50
    queries:
      - query_id: q_ai_healthcare
        text: artificial intelligence healthcare education
        expected_topic_contains:
          - artificial intelligence
          - healthcare
      - query_id: q_climate_policy
        text: climate change policy economics
        expected_topic_contains:
          - climate change
          - policy
      - query_id: q_tuberculosis
        text: tuberculosis diagnosis treatment
        expected_topic_contains:
          - tuberculosis
      - query_id: q_digital_marketing
        text: digital marketing social media
        expected_topic_contains:
          - digital marketing
          - social media
      - query_id: q_dementia
        text: dementia cognitive impairment
        expected_topic_contains:
          - dementia
          - cognitive impairment
  ml:
    seed: 660
    test_fraction: 0.3
    high_citation_quantile: 0.75
  ranking:
    top_n: 100
    weights:
      citation_count: 0.45
      pagerank: 0.15
      recency: 0.15
      reference_count: 0.10
      author_count: 0.05
      topic_count: 0.10
  advanced_retrieval:
    top_k: 10
    candidate_k: 100
    dense_vector_size: 128
    dense_min_count: 1
    dense_max_iter: 10
    rrf_k: 60
    graph_alphas:
      - 0.0
      - 0.25
      - 0.5
    demo_query: retrieval augmented generation for clinical decision support
  vector_index:
    backend: auto
    max_documents: 100000
    max_features: 100000
    n_neighbors: 10
