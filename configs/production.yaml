project:
  name: scigraph

dataset:
  name: openalex_works
  source_name: OpenAlex Snapshot or Works API
  source_url: https://api.openalex.org/works
  documentation_url: https://help.openalex.org/data/works/attributes/
  license: CC0
  sample_size: 100000
  seed: 660
  api_page_size: 200
  contact_email: ""
  filters:
    from_publication_date: "2010-01-01"
    type: "article"
    has_abstract: true
  select_fields:
    - id
    - doi
    - title
    - display_name
    - publication_date
    - publication_year
    - type
    - authorships
    - primary_location
    - locations
    - cited_by_count
    - referenced_works
    - concepts
    - topics
    - abstract_inverted_index
    - language
    - open_access

