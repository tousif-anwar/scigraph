project:
  name: scigraph

dataset:
  name: openalex_works
  source_name: OpenAlex Works API
  source_url: https://api.openalex.org/works
  documentation_url: https://help.openalex.org/data/works/attributes/
  license: CC0
  sample_size: 1000
  seed: 660
  api_page_size: 200
  contact_email: ""
  filters:
    from_publication_date: "2020-01-01"
    type: "article"
    has_abstract: true
  select_fields:
    - id
    - doi
    - title
    - display_name
    - publication_date
    - publication_year
    - type
    - authorships
    - primary_location
    - locations
    - cited_by_count
    - referenced_works
    - concepts
    - topics
    - abstract_inverted_index
    - language
    - open_access

paths:
  raw_dir: data/raw
  raw_sample_jsonl: data/raw/openalex_works_sample.jsonl
  raw_metadata_json: data/raw/openalex_sample_metadata.json
  schema_summary_json: reports/results/schema_summary.json
  data_dictionary_md: docs/DATA_DICTIONARY.md
  data_quality_json: reports/results/data_quality_report.json
  data_quality_md: docs/DATA_QUALITY_REPORT.md
  bronze_works: data/bronze/openalex_works
  silver_publications: data/silver/publications
  gold_publications: data/gold/publications
  gold_authors: data/gold/authors
  gold_author_publications: data/gold/author_publications
  gold_citation_edges: data/gold/citation_edges
  gold_topics: data/gold/topics
  pipeline_report_json: reports/results/bronze_silver_gold_report.json
  pipeline_report_md: docs/BRONZE_SILVER_GOLD_PIPELINE.md
  scalability_results_json: experiments/scalability/results/scalability_results.json
  scalability_results_csv: experiments/scalability/results/scalability_results.csv
  scalability_report_md: docs/SCALABILITY_BENCHMARKS.md
  scalability_runs_dir: experiments/scalability/runs
  text_documents: data/gold/text_documents
  text_terms_global: data/gold/text_terms_global
  text_terms_by_year: data/gold/text_terms_by_year
  text_terms_by_topic: data/gold/text_terms_by_topic
  text_tfidf_terms: data/gold/text_tfidf_terms
  text_report_json: reports/results/text_analysis_report.json
  text_report_md: docs/TEXT_ANALYSIS.md
  cluster_assignments: data/gold/cluster_assignments
  cluster_terms: data/gold/cluster_terms
  cluster_representative_papers: data/gold/cluster_representative_papers
  cluster_report_json: reports/results/clustering_report.json
  cluster_report_md: docs/CLUSTERING.md
  citation_degrees: data/gold/citation_degrees
  citation_pagerank: data/gold/citation_pagerank
  citation_unusual_pagerank: data/gold/citation_unusual_pagerank
  citation_graph_report_json: reports/results/citation_graph_report.json
  citation_graph_report_md: docs/CITATION_GRAPH.md
  author_collaboration_edges: data/gold/author_collaboration_edges
  author_collaboration_metrics: data/gold/author_collaboration_metrics
  author_collaboration_report_json: reports/results/author_collaboration_report.json
  author_collaboration_report_md: docs/AUTHOR_COLLABORATION_GRAPH.md
  temporal_yearly_metrics: data/gold/temporal_yearly_metrics
  temporal_topic_trends: data/gold/temporal_topic_trends
  temporal_emerging_topics: data/gold/temporal_emerging_topics
  temporal_report_json: reports/results/temporal_analysis_report.json
  temporal_report_md: docs/TEMPORAL_ANALYSIS.md
  streaming_batch_metrics: data/gold/streaming_batch_metrics
  streaming_alerts: data/gold/streaming_alerts
  streaming_report_json: reports/results/streaming_simulation_report.json
  streaming_report_md: docs/STREAMING_SIMULATION.md
  retrieval_rankings: data/gold/retrieval_rankings
  retrieval_evaluation: data/gold/retrieval_evaluation
  retrieval_report_json: reports/results/retrieval_report.json
  retrieval_report_md: docs/RETRIEVAL.md

spark:
  app_name: SciGraphMilestone3
  master: local[*]
  shuffle_partitions: 16
  java_home: C:/Users/tousi/.jdks/openjdk-23.0.2
  hadoop_home: tools/hadoop
  benchmark_scale_records:
    - 100
    - 500
    - 1000
  text:
    min_token_length: 3
    top_n_terms: 25
    language: en
  clustering:
    k_values:
      - 3
      - 5
      - 8
    max_iter: 20
    seed: 660
    num_features: 4096
    min_token_length: 3
    language: en
    top_terms_per_cluster: 12
    representative_papers_per_cluster: 5
  graph:
    pagerank_iterations: 10
    pagerank_damping: 0.85
    top_n: 25
  streaming:
    batch_size: 100
    alert_missing_title_rate: 0.0
    alert_missing_author_rate: 0.05
  retrieval:
    top_k: 10
    queries:
      - query_id: q_ai_healthcare
        text: artificial intelligence healthcare education
        expected_topic_contains:
          - artificial intelligence
          - healthcare
      - query_id: q_climate_policy
        text: climate change policy economics
        expected_topic_contains:
          - climate change
          - policy
      - query_id: q_tuberculosis
        text: tuberculosis diagnosis treatment
        expected_topic_contains:
          - tuberculosis
      - query_id: q_digital_marketing
        text: digital marketing social media
        expected_topic_contains:
          - digital marketing
          - social media
      - query_id: q_dementia
        text: dementia cognitive impairment
        expected_topic_contains:
          - dementia
          - cognitive impairment
